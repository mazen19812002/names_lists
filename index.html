<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KFS-HIET Final Report Generator</title>
    
    <!-- Dependencies: Cairo Font, 11 Handwriting Fonts (Straight '1' + Kalam), & SheetJS for Excel processing -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amatic+SC:wght@700&family=Caveat:wght@700&family=Zeyada&family=Reenie+Beanie&family=Just+Another+Hand&family=Nanum+Pen+Script&family=Nothing+You+Could+Do&family=Waiting+for+the+Sunrise&family=Covered+By+Your+Grace&family=Dawning+of+a+New+Day&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        /* === Global UI Styles & Glassmorphism === */
        :root {
            --blue-grad: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --btn-accept: linear-gradient(135deg, #00b09b, #96c93d);
            --btn-delete: linear-gradient(135deg, #ff416c, #ff4b2b);
            --btn-info: linear-gradient(135deg, #36D1DC, #5B86E5);
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(255, 255, 255, 0.5);
            --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 50%, #80deea 100%);
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* === Control Panel === */
        #control-panel {
            background: var(--glass-bg);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            padding: 20px;
            margin: 15px;
            border-radius: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            align-items: end;
            transition: all 0.3s ease;
        }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-weight: bold; font-size: 14px; color: #1e3c72; }
        input[type="text"], input[type="file"], select {
            padding: 8px 12px; border: 1px solid #ccc; border-radius: 8px;
            font-size: 14px; outline: none; transition: border-color 0.3s;
            font-family: 'Segoe UI', sans-serif; background: #fff;
        }
        input[type="text"]:focus, select:focus { border-color: #2a5298; }

        .btn-group { grid-column: 1 / -1; display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }
        
        button {
            padding: 10px 20px; border: none; border-radius: 25px; color: white;
            font-weight: bold; font-size: 14px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.2s, box-shadow 0.2s;
            display: flex; align-items: center; gap: 8px;
        }
        button:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
        .btn-action { background: var(--btn-accept); }
        .btn-info { background: var(--btn-info); padding: 8px 12px; font-size: 13px; justify-content: center;}
        .btn-tool { background: var(--blue-grad); padding: 10px; border-radius: 50%; }

        /* Floating Toggle Button */
        #floating-toggle {
            position: fixed; bottom: 60px; right: 20px; width: 50px; height: 50px;
            border-radius: 50%; background: var(--blue-grad); color: white;
            font-size: 24px; border: none; box-shadow: var(--shadow); cursor: pointer;
            z-index: 1000; transition: transform 0.3s; justify-content: center;
        }
        #floating-toggle:hover { transform: rotate(90deg) scale(1.1); }

        /* === Footer === */
        #animated-footer {
            position: fixed; bottom: 0; width: 100%; background: linear-gradient(90deg, #ff007f, #7928ca, #0070f3, #00dfd8, #ff007f);
            background-size: 400% 100%; animation: gradient-scroll 10s linear infinite;
            color: white; text-align: center; padding: 5px 0; font-size: 14px;
            font-weight: bold; z-index: 999;
        }
        @keyframes gradient-scroll { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

        /* === Report Container & Pages === */
        #report-wrapper {
            flex: 1; padding: 20px; display: flex; flex-direction: column;
            align-items: center; gap: 20px; overflow: auto; margin-bottom: 50px;
            transform-origin: top center; transition: transform 0.3s ease;
        }

        .page {
            background: white;
            width: 210mm;
            height: 297mm; 
            padding: 10mm;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            font-family: 'Cairo', sans-serif;
            color: #000;
            direction: rtl;
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow: hidden; 
        }

        /* === Report Internal Styling === */
        .report-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 6px; }
        .header-text { font-weight: bold; font-size: 15px; line-height: 1.3; }
        .header-text.ar { text-align: right; }
        .header-text.en { text-align: left; direction: ltr; }
        .logo { width: 80px; height: auto; }

        .vision-box {
            border: 1px solid #000; padding: 4px; text-align: center; font-weight: bold;
            margin-bottom: 6px; font-size: 12px; white-space: nowrap; overflow: hidden;
        }

        .meta-data-table { width: 100%; border-collapse: collapse; margin-bottom: 6px; font-size: 14px; }
        .meta-data-table td { padding: 2px; width: 33.33%; white-space: nowrap; }
        .meta-data-table td:nth-child(1) { text-align: right; }
        .meta-data-table td:nth-child(2) { text-align: center; }
        .meta-data-table td:nth-child(3) { text-align: right; } 
        .bold-label { font-weight: 700; }
        .regular-data { font-weight: 400; }

        /* Data Table Constraints - Adjusted for perfect A4 fitting */
        .data-table {
            width: 100%; border-collapse: collapse; font-size: 13px; 
        }
        .data-table tr {
            height: 24.5px; /* Reduced slightly to ensure full fit on A4 */
        }
        .data-table th, .data-table td {
            border: 1px solid #000; text-align: center; font-weight: bold; box-sizing: border-box;
        }
        .data-table td {
            padding: 1px 4px; 
        }
        
        /* === Table Headers Optimization === */
        .data-table th { 
            background-color: #f0f0f0; 
            -webkit-print-color-adjust: exact; 
            font-size: 12px;
            white-space: nowrap; 
            padding: 2px 2px;
            line-height: 1.1; 
        }
        
        /* Dynamic Name Column */
        .data-table td:nth-child(3) {
            text-align: right; 
            padding-right: 10px; 
            white-space: nowrap; 
        }

        /* Signature Layout */
        .signature-area {
            margin-top: 5px; /* Reduced top margin to ensure A4 fit */
            font-size: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        .sig-col { display: flex; flex-direction: column; gap: 5px; }
        .sig-col.center { text-align: center; align-items: center; }

        /* === Print Media Queries - Strict A4 Constraints === */
        @media print {
            @page { size: A4; margin: 0; }
            body { background: none; margin: 0; padding: 0; }
            #control-panel, #floating-toggle, #animated-footer { display: none !important; }
            #report-wrapper { padding: 0; gap: 0; display: block; transform: scale(1) !important; margin: 0; overflow: hidden; }
            .page {
                box-shadow: none; 
                margin: 0; 
                padding: 8mm 10mm; /* Reduced vertical padding slightly to prevent overflow */
                width: 210mm;
                height: 297mm !important;
                max-height: 297mm !important;
                page-break-after: always;
                page-break-inside: avoid;
            }
            .page:last-child { page-break-after: auto; }
        }
    </style>
</head>
<body>

    <!-- Control Panel -->
    <div id="control-panel">
        
        <!-- الخيار الأول: تحميل من الجهاز -->
        <div class="input-group">
            <label>📁 تحميل شيت إكسيل (من الجهاز)</label>
            <input type="file" id="excel-file" accept=".xlsx, .xls">
        </div>

        <!-- الخيار الثاني: قراءة من نفس المسار (قائمة منسدلة ديناميكية) -->
        <div class="input-group">
            <label>📂 قراءة ملف (من نفس مسار GitHub)</label>
            <div style="display: flex; gap: 5px;">
                <select id="local-file-name" style="flex:1;">
                    <option value="" disabled selected>جاري البحث عن ملفات...</option>
                    <option value="data.xlsx">data.xlsx (افتراضي)</option>
                </select>
                <button class="btn-info" onclick="loadLocalFile()" title="قراءة الملف من الخادم">تحميل</button>
            </div>
        </div>

        <!-- اختيارات الخط واللون والاصطفاف للدرجات المضافة حديثاً -->
        <div class="input-group">
            <label>🖋️ خط الدرجات (يدوي)</label>
            <select id="grade-font-select" onchange="renderPages()">
                <option value="'Caveat', cursive" selected>Caveat</option>
                <option value="'Kalam', cursive">Kalam</option>
                <option value="'Amatic SC', cursive">Amatic SC</option>
                <option value="'Zeyada', cursive">Zeyada</option>
                <option value="'Just Another Hand', cursive">Just Another Hand</option>
                <option value="'Reenie Beanie', cursive">Reenie Beanie</option>
                <option value="'Nanum Pen Script', cursive">Nanum Pen Script</option>
                <option value="'Nothing You Could Do', cursive">Nothing You Could Do</option>
                <option value="'Waiting for the Sunrise', cursive">Waiting for the Sunrise</option>
                <option value="'Covered By Your Grace', cursive">Covered By Your Grace</option>
                <option value="'Dawning of a New Day', cursive">Dawning of a New Day</option>
            </select>
        </div>

        <div class="input-group">
            <label>🎨 لون الدرجات</label>
            <input type="color" id="grade-color-input" value="#0000cd" oninput="renderPages()" style="height: 38px; width: 100%; padding: 2px; cursor: pointer;">
        </div>

        <div class="input-group">
            <label>🔀 اصطفاف عشوائي للأرقام</label>
            <select id="random-align-toggle" onchange="renderPages()">
                <option value="on" selected>مفعل (عشوائي)</option>
                <option value="off">مغلق (منتظم)</option>
            </select>
        </div>
        
        <div class="input-group">
            <label>📖 الفصل الدراسي</label>
            <select id="semester-select" onchange="renderPages()">
                <option value="الفصل الدراسي الاول">الفصل الدراسي الاول</option>
                <option value="الفصل الدراسي الثاني">الفصل الدراسي الثاني</option>
            </select>
        </div>

        <div class="input-group">
            <label>🎓 الفرقة</label>
            <select id="year-select" onchange="renderPages()">
                <option value="الاعدادية" selected>الاعدادية</option>
                <option value="الاولي">الاولي</option>
                <option value="الثانية">الثانية</option>
                <option value="الثالثة">الثالثة</option>
                <option value="الرابعة">الرابعة</option>
            </select>
        </div>

        <div class="input-group">
            <label>🏛️ القسم</label>
            <select id="dept-select" onchange="renderPages()">
                <option value="العلوم الأساسية" selected>العلوم الأساسية</option>
                <option value="الهندسة المدنية">الهندسة المدنية</option>
                <option value="الهندسة المعمارية">الهندسة المعمارية</option>
                <option value="الهندسة الكهربية">الهندسة الكهربية</option>
                <option value="هندسة الإلكترونيات والاتصالات الكهربية">هندسة الإلكترونيات والاتصالات الكهربية</option>
                <option value="هندسة الحاسبات والتحكم الالي">هندسة الحاسبات والتحكم الالي</option>
            </select>
        </div>

        <div class="input-group">
            <label>🌿 الشعبة</label>
            <select id="section-select" onchange="renderPages()">
                <option value="عام" selected>عام</option>
                <option value="هندسة والإلكترونيات والاتصالات الكهربية">هندسة والإلكترونيات والاتصالات الكهربية</option>
                <option value="هندسة الحاسبات والتحكم الالي">هندسة الحاسبات والتحكم الالي</option>
            </select>
        </div>

        <div class="input-group">
            <label>📚 المقرر الدراسي</label>
            <input type="text" id="course-input" value="لغة انجليزية فنية" oninput="renderPages()">
        </div>

        <div class="input-group">
            <label>📄 النوع</label>
            <input type="text" id="type-input" value="اعمال الفصل" oninput="renderPages()">
        </div>

        <div class="input-group">
            <label>📑 نوع التقرير</label>
            <input type="text" id="subtype-input" value="درجات بعد الاعتماد" oninput="renderPages()">
        </div>

        <div class="input-group">
            <label>📊 رأس العمود الأخير</label>
            <input type="text" id="last-col-input" value="اعمال الفصل [10]" oninput="renderPages()">
        </div>

        <div class="input-group">
            <label>✍️ اسم هيئة التدريس (الأساسي)</label>
            <input type="text" id="instructor-input" value="د/ عضو هيئة تدريس" oninput="renderPages()">
        </div>

        <div class="input-group">
            <label>✍️ اسم عضو إضافي (اختياري)</label>
            <input type="text" id="instructor2-input" placeholder="اتركه فارغاً إذا لم يوجد" oninput="renderPages()">
        </div>
        
        <div class="btn-group">
            <button class="btn-action" onclick="window.print()">🖨️ طباعة PDF</button>
            <button class="btn-tool" onclick="zoom(0.1)" title="تكبير">➕</button>
            <button class="btn-tool" onclick="zoom(-0.1)" title="تصغير">➖</button>
            <button class="btn-tool" onclick="toggleFullScreen()" title="ملء الشاشة">🖥️</button>
        </div>
    </div>

    <button id="floating-toggle" onclick="toggleUI()" title="إظهار/إخفاء لوحة التحكم">⚙️</button>

    <!-- Report Area -->
    <div id="report-wrapper"></div>

    <!-- Animated Footer -->
    <div id="animated-footer">
        All rights are reserved to Dr. Mazen Badawy – Doctor of English Teaching & Testing
    </div>

    <!-- Scripts -->
    <script>
        let currentZoom = 1;
        let uiVisible = true;
        let globalStudentsData = []; 

        window.onload = function() { 
            renderPages(); 
            autoLoadExcelFiles(); // جلب قائمة الملفات ديناميكياً عند بدء التشغيل
        }

        // --- دالة جلب قائمة الملفات التلقائية (GitHub API / Local Fetch) ---
        async function autoLoadExcelFiles() {
            const select = document.getElementById('local-file-name');
            const host = window.location.hostname;
            const path = window.location.pathname;

            try {
                // محاولة 1: استخراج البيانات من GitHub API إذا كان الموقع مرفوعاً على GitHub Pages
                if (host.includes('github.io')) {
                    const username = host.split('.')[0];
                    const repo = path.split('/')[1] || '';
                    
                    if (username) {
                        const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/`);
                        if (response.ok) {
                            const files = await response.json();
                            const excelFiles = files.filter(f => f.name.endsWith('.xlsx') || f.name.endsWith('.xls'));
                            
                            if (excelFiles.length > 0) {
                                select.innerHTML = '';
                                excelFiles.forEach((file, index) => {
                                    const option = document.createElement('option');
                                    option.value = file.name;
                                    option.textContent = file.name;
                                    if (index === 0) option.selected = true;
                                    select.appendChild(option);
                                });
                                return; // تم الجلب بنجاح
                            } else {
                                select.innerHTML = '<option value="" disabled>لا يوجد ملفات اكسيل في المستودع</option>';
                                return;
                            }
                        }
                    }
                } 
                
                // محاولة 2: قراءة مسار المجلد (تعمل في السيرفرات المحلية Localhost)
                const res = await fetch('./');
                if (res.ok) {
                    const text = await res.text();
                    const regex = /href="([^"]+\.(xlsx|xls))"/gi;
                    let match;
                    const localFiles = [];
                    
                    while ((match = regex.exec(text)) !== null) {
                        let fileName = match[1].replace(/^\.\//, ''); // إزالة ./ إن وجدت
                        if (!localFiles.includes(fileName)) {
                            localFiles.push(decodeURIComponent(fileName));
                        }
                    }
                    
                    if (localFiles.length > 0) {
                        select.innerHTML = '';
                        localFiles.forEach((f, index) => {
                            const option = document.createElement('option');
                            option.value = f;
                            option.textContent = f;
                            if(index === 0) option.selected = true;
                            select.appendChild(option);
                        });
                        return;
                    }
                }
                
                // إذا لم يجد شيئاً (الحالة الافتراضية)
                select.innerHTML = '<option value="data.xlsx">data.xlsx</option>';
            } catch (error) {
                console.log("استخدام الخيارات الافتراضية لعدم توفر API للاستعراض");
                select.innerHTML = '<option value="data.xlsx">data.xlsx</option>';
            }
        }

        // 1. القراءة من ملف محلي (جهاز الكمبيوتر)
        document.getElementById('excel-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                processWorkbook(workbook);
            };
            reader.readAsArrayBuffer(file);
        });

        // 2. القراءة من ملف مرفوع على نفس مسار السيرفر / GitHub
        function loadLocalFile() {
            const fileName = document.getElementById('local-file-name').value;
            if(!fileName) {
                alert("يرجى اختيار ملف أولاً");
                return;
            }
            fetch(fileName)
                .then(response => {
                    if (!response.ok) throw new Error("File not found");
                    return response.arrayBuffer();
                })
                .then(data => {
                    const workbook = XLSX.read(new Uint8Array(data), {type: 'array'});
                    processWorkbook(workbook);
                })
                .catch(error => {
                    alert('لم يتم العثور على الملف في المسار الحالي! تأكد من وجود الملف: ' + fileName);
                });
        }

        // --- المعالجة الذكية لملف الإكسيل واستخراج الأعمدة ---
        function processWorkbook(workbook) {
            globalStudentsData = [];
            
            workbook.SheetNames.forEach(sheetName => {
                const worksheet = workbook.Sheets[sheetName];
                const sheetData = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: ''});
                
                let headerFound = false;
                let hIdx = { m: -1, seat: -1, name: -1, code: -1, status: -1, grade: -1 };

                for (let i = 0; i < sheetData.length; i++) {
                    const row = sheetData[i];
                    const rowStr = row.join('').replace(/\s/g, '');
                    
                    // البحث عن صف العناوين
                    if (rowStr.includes("رقمالجلوس") || rowStr.includes("اسمالطالب") || rowStr.includes("الكود")) {
                        headerFound = true;
                        
                        // تحديد أماكن الأعمدة ديناميكياً
                        for (let c = 0; c < row.length; c++) {
                            let val = String(row[c]).trim();
                            if (!val) continue;
                            
                            if (val === "م" || val === "#" || val.includes("تسلسل")) hIdx.m = c;
                            else if (val.includes("جلوس")) hIdx.seat = c;
                            else if (val.includes("طالب") || val.includes("الاسم")) hIdx.name = c;
                            else if (val.includes("كود")) hIdx.code = c;
                            else if (val.includes("حالة")) hIdx.status = c;
                            else if (val.includes("اعمال") || val.includes("درجة") || val.includes("مجموع")) hIdx.grade = c;
                        }
                        
                        if (hIdx.grade === -1) {
                            let maxIdx = Math.max(hIdx.m, hIdx.seat, hIdx.name, hIdx.code, hIdx.status);
                            hIdx.grade = maxIdx + 1;
                        }

                        // قراءة بيانات الطلاب أسفل صف العناوين
                        for (let j = i + 1; j < sheetData.length; j++) {
                            const dataRow = sheetData[j];
                            if (dataRow.join('').trim() === '') continue; 
                            
                            const mVal = hIdx.m !== -1 ? String(dataRow[hIdx.m] || '').trim() : '';
                            const seatVal = hIdx.seat !== -1 ? String(dataRow[hIdx.seat] || '').trim() : '';
                            const nameVal = hIdx.name !== -1 ? String(dataRow[hIdx.name] || '').trim() : '';
                            const codeVal = hIdx.code !== -1 ? String(dataRow[hIdx.code] || '').trim() : '';
                            let statusVal = hIdx.status !== -1 ? String(dataRow[hIdx.status] || '').trim() : 'مستجد';
                            
                            if (statusVal === '') statusVal = 'مستجد'; 
                            
                            const gradeVal = hIdx.grade !== -1 ? String(dataRow[hIdx.grade] || '').trim() : '';

                            if (nameVal === '' && seatVal === '') continue;

                            globalStudentsData.push([mVal, seatVal, nameVal, codeVal, statusVal, gradeVal]);
                        }
                        break; 
                    }
                }
                
                // --- معالجة احتياطية ---
                if (!headerFound) {
                    sheetData.forEach(row => {
                        if (row.join('').trim() === '') return;
                        const str0 = String(row[0] || '').trim();
                        const str1 = String(row[1] || '').trim();
                        const str2 = String(row[2] || '').trim();
                        
                        if (str0 === "م" || str1 === "رقم الجلوس" || str2 === "اسم الطالب") return; 
                        
                        let sVal = String(row[4] || '').trim();
                        globalStudentsData.push([
                            str0, str1, str2, 
                            String(row[3] || '').trim(), 
                            sVal === '' ? 'مستجد' : sVal, 
                            String(row[5] || '').trim()
                        ]);
                    });
                }
            });
            renderPages();
        }

        // --- بناء وطباعة صفحات التقرير ---
        function renderPages() {
            const wrapper = document.getElementById('report-wrapper');
            wrapper.innerHTML = ''; 

            const semester = document.getElementById('semester-select').value;
            const year = document.getElementById('year-select').value;
            const dept = document.getElementById('dept-select').value;
            const section = document.getElementById('section-select').value;
            const course = document.getElementById('course-input').value;
            const reportType = document.getElementById('type-input').value;
            const subType = document.getElementById('subtype-input').value;
            const lastCol = document.getElementById('last-col-input').value;
            
            const inst1 = document.getElementById('instructor-input').value;
            const inst2 = document.getElementById('instructor2-input').value;
            
            // قراءة المتغيرات الخاصة بالخط واللون والعشوائية
            const gradeFont = document.getElementById('grade-font-select').value;
            const gradeColor = document.getElementById('grade-color-input').value;
            const isRandomAlign = document.getElementById('random-align-toggle').value === 'on';

            if (globalStudentsData.length === 0) {
                wrapper.innerHTML = createPageHTML([], semester, year, dept, section, course, reportType, subType, lastCol, inst1, inst2, gradeFont, gradeColor, isRandomAlign);
                return;
            }

            const chunkSize = 25; 
            for (let i = 0; i < globalStudentsData.length; i += chunkSize) {
                const chunk = globalStudentsData.slice(i, i + chunkSize);
                wrapper.innerHTML += createPageHTML(chunk, semester, year, dept, section, course, reportType, subType, lastCol, inst1, inst2, gradeFont, gradeColor, isRandomAlign);
            }
        }

        function createPageHTML(chunkData, semester, year, dept, section, course, reportType, subType, lastCol, inst1, inst2, gradeFont, gradeColor, isRandomAlign) {
            let rowsHTML = '';
            if (chunkData.length === 0) {
                rowsHTML = `<tr><td colspan="6" style="padding: 20px;">الرجاء تحميل ملف الإكسيل لعرض البيانات</td></tr>`;
            } else {
                chunkData.forEach(row => {
                    let statusTxt = row[4] || '';
                    let statusStyle = statusTxt.length > 7 ? 'font-size: 10px; letter-spacing: -0.5px;' : 'font-size: 13px;';
                    
                    // معالجة الأرقام في العمود الأخير بناءً على خيار العشوائية مع إصلاح مشكلة تمدد الـ Line-height للخطوط اليدوية
                    let gradeTxt = row[5] !== undefined ? String(row[5]).trim() : '';
                    if (/\d/.test(gradeTxt)) {
                        let transformStyle = '';
                        if (isRandomAlign) {
                            let randomRotate = (Math.random() * 8 - 4).toFixed(1); 
                            let randomY = (Math.random() * 4 - 2).toFixed(1); 
                            let randomX = (Math.random() * 12 - 6).toFixed(1); 
                            transformStyle = `transform: translate(${randomX}px, ${randomY}px) rotate(${randomRotate}deg);`;
                        }
                        
                        gradeTxt = `<span style="font-family: ${gradeFont}; color: ${gradeColor}; font-weight: bold; font-size: 21px; display: inline-block; line-height: 0.5; ${transformStyle}">${gradeTxt}</span>`;
                    }

                    rowsHTML += `
                        <tr>
                            <td>${row[0]}</td>
                            <td>${row[1]}</td>
                            <td>${row[2]}</td>
                            <td>${row[3]}</td>
                            <td style="white-space: nowrap; ${statusStyle}">${statusTxt}</td>
                            <td>${gradeTxt}</td>
                        </tr>
                    `;
                });
            }

            let inst2NameHtml = inst2.trim() !== '' ? `<span>${inst2}</span>` : '';
            let inst2LineHtml = inst2.trim() !== '' ? `<span>(---------------------)</span>` : '';
            let inst2LabelHidden = inst2.trim() !== '' ? `<span style="visibility:hidden;">أعضاء التدريس:</span>` : '';

            return `
            <div class="page">
                <div class="report-header">
                    <div class="header-text ar">
                        وزارة التعليم العالي والبحث العلمي<br>
                        المعهد العالي للهندسة والتكنولوجيا<br>
                        بكفرالشيخ
                    </div>
                    <img src="00.jpg" alt="Logo" class="logo" onerror="this.style.display='none'">
                    <div class="header-text en">
                        Ministry of Higher Education and<br>
                        Scientific Research<br>
                        KFS-HIET
                    </div>
                </div>

                <div class="vision-box">
                    الرؤية : أن يكون المعهد رائداً ومعتمداً أكاديمياً في مجالات العلوم الهندسية والتكنولوجية على المستوى المحلي والإقليمي
                </div>

                <table class="meta-data-table">
                    <tr>
                        <td><span class="bold-label">امتحان : </span><span class="regular-data">${semester}</span></td>
                        <td><span class="bold-label">العام الجامعي : </span><span class="regular-data">2025/2026</span></td>
                        <td><span class="bold-label">اللائحة : </span><span class="regular-data">لائحة الفصل الدراسي 2018</span></td>
                    </tr>
                    <tr>
                        <td><span class="bold-label">القسم : </span><span class="regular-data">${dept}</span></td>
                        <td><span class="bold-label">الفرقة : </span><span class="regular-data">${year}</span></td>
                        <td><span class="bold-label">الشعبة : </span><span class="regular-data">${section}</span></td>
                    </tr>
                    <tr>
                        <td><span class="bold-label">المقرر الدراسي : </span><span class="regular-data">${course}</span></td>
                        <td><span class="bold-label">النوع : </span><span class="regular-data">${reportType}</span></td>
                        <td><span class="bold-label">نوع التقرير : </span><span class="regular-data">${subType}</span></td>
                    </tr>
                </table>

                <table class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 4%;">م</th>
                            <th style="width: 14%;">رقم الجلوس</th>
                            <th>اسم الطالب</th> 
                            <th style="width: 14%;">الكود</th>
                            <th style="width: 10%;">الحالة</th>
                            <th style="width: 15%;">${lastCol}</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rowsHTML}
                    </tbody>
                </table>

                <div class="signature-area">
                    <div class="sig-col">
                        <span>أعضاء التدريس:</span>
                        ${inst2LabelHidden}
                    </div>
                    <div class="sig-col center">
                        <span>${inst1}</span>
                        ${inst2NameHtml}
                    </div>
                    <div class="sig-col center">
                        <span>(---------------------)</span>
                        ${inst2LineHtml}
                    </div>
                </div>
            </div>
            `;
        }

        // --- أدوات التحكم (تكبير/تصغير وشاشة كاملة) ---
        function zoom(amount) {
            currentZoom += amount;
            if (currentZoom < 0.5) currentZoom = 0.5;
            if (currentZoom > 2) currentZoom = 2;
            document.getElementById('report-wrapper').style.transform = `scale(${currentZoom})`;
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        function toggleUI() {
            const panel = document.getElementById('control-panel');
            const footer = document.getElementById('animated-footer');
            uiVisible = !uiVisible;
            if (uiVisible) {
                panel.style.display = 'grid';
                footer.style.display = 'block';
            } else {
                panel.style.display = 'none';
                footer.style.display = 'none';
            }
        }
    </script>
</body>
</html>
